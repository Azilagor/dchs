{% extends "admin/base_admin.html" %}
{% block title %}Отделы · Админка{% endblock %}
{% block admin_content %}
<h1>Отделы</h1>
<form method="post" class="inline-form">
    <input type="text" name="name" placeholder="Название отдела" required>
    <input type="text" name="description" placeholder="Описание">
    <button>Добавить</button>
</form>
<table class="table">
    <thead><tr><th>Название</th><th>Описание</th></tr></thead>
    <tbody>{% for item in departments %}<tr><td>{{ item.name }}</td><td>{{ item.description or '—' }}</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
